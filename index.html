<!DOCTYPE DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BishGuard - AI Phishing Detection</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #00ff88;
            --secondary: #0088ff;
            --danger: #ff0055;
            --dark: #0a0e27;
            --darker: #050814;
            --glass: rgba(255, 255, 255, 0.05);
        }
        
        body {
            font-family: 'Space Mono', monospace;
            background: var(--darker);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .content {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 1s ease-out;
        }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 40px rgba(0, 255, 136, 0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        .tagline {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }
        
        .detector-card {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.8), rgba(5, 8, 20, 0.9));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 20px;
            padding: 3rem;
            max-width: 700px;
            width: 100%;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(0, 255, 136, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeInUp 1s ease-out 0.3s backwards;
            position: relative;
            overflow: hidden;
        }
        
        .detector-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.1), transparent);
            transition: left 0.5s;
        }
        
        .detector-card:hover::before {
            left: 100%;
        }
        
        .input-group {
            margin-bottom: 2rem;
        }
        
        label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--primary);
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 1rem 1.5rem;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 12px;
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }
        
        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            transform: translateY(-2px);
        }
        
        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        .btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            color: var(--darker);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn:hover::before {
            width: 300%;
            height: 300%;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
        }
        
        .btn:active {
            transform: translateY(-1px);
        }
        
        .btn span {
            position: relative;
            z-index: 1;
        }
        
        .result {
            margin-top: 2rem;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            border-left: 4px solid var(--primary);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s;
        }
        
        .result.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .result.safe {
            border-left-color: var(--primary);
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), transparent);
        }
        
        .result.danger {
            border-left-color: var(--danger);
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.1), transparent);
        }
        
        .result-status {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .result-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        
        .result-icon.safe {
            background: var(--primary);
            color: var(--darker);
            animation: pulse 2s ease-in-out infinite;
        }
        
        .result-icon.danger {
            background: var(--danger);
            color: #fff;
            animation: shake 0.5s ease-in-out;
        }
        
        .result-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .detail-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .detail-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.3rem;
        }
        
        .detail-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0.5rem;
        }
        
        footer {
            margin-top: 3rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            animation: fadeIn 1s ease-out 0.6s backwards;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 1rem 0;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto;
            border: 3px solid rgba(0, 255, 136, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            }
            to {
                text-shadow: 0 0 40px rgba(0, 255, 136, 0.6);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 rgba(0, 255, 136, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
            }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .detector-card {
                padding: 2rem 1.5rem;
            }
            
            .result-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="content">
        <header>
            <h1>BishGuard</h1>
            <p class="tagline">Neural Threat Detection</p>
        </header>
        
        <div class="detector-card">
            <div class="input-group">
                <label for="url-input">Enter URL to Analyze</label>
                <input 
                    type="text" 
                    id="url-input" 
                    placeholder="https://example.com/suspicious-link"
                    autocomplete="off"
                >
            </div>
            
            <button class="btn" onclick="analyzeURL()">
                <span>Scan for Threats</span>
            </button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>
            
            <div class="result" id="result"></div>
            
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="accuracy">81.1%</div>
                    <div class="stat-label">Accuracy</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="f1score">79.9%</div>
                    <div class="stat-label">F1 Score</div>
                </div>
            </div>
        </div>
        
        <footer>
            Powered by Random Forest ML • Trained on 2,488 URLs
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 3D Background Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // Create particle system
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 2000;
        const posArray = new Float32Array(particlesCount * 3);
        
        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 100;
        }
        
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.15,
            color: 0x00ff88,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);
        
        // Create geometric shapes
        const geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
        const material = new THREE.MeshBasicMaterial({ 
            color: 0x0088ff, 
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });
        const torusKnot = new THREE.Mesh(geometry, material);
        scene.add(torusKnot);
        
        camera.position.z = 30;
        
        // Animation
        let mouseX = 0;
        let mouseY = 0;
        
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });
        
        function animate() {
            requestAnimationFrame(animate);
            
            particlesMesh.rotation.y += 0.001;
            particlesMesh.rotation.x += 0.0005;
            
            torusKnot.rotation.x += 0.005;
            torusKnot.rotation.y += 0.01;
            
            camera.position.x += (mouseX * 5 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 5 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // ML Model Implementation
        function extractFeatures(url) {
            const features = {};
            
            // URL length
            features.url_length = url.length;
            
            // Valid URL check
            try {
                const urlObj = new URL(url);
                features.valid_url = 1;
                features.isHttps = urlObj.protocol === 'https:' ? 1 : 0;
                features.path_length = urlObj.pathname.length;
            } catch {
                features.valid_url = 0;
                features.isHttps = 0;
                features.path_length = 0;
            }
            
            // @ symbol
            features.at_symbol = url.includes('@') ? 1 : 0;
            
            // Sensitive words
            const sensitiveWords = ['verify', 'account', 'update', 'confirm', 'login', 'secure', 'bank', 'password'];
            features.sensitive_words_count = sensitiveWords.reduce((count, word) => 
                count + (url.toLowerCase().includes(word) ? 1 : 0), 0);
            
            // Count special characters
            features.nb_dots = (url.match(/\./g) || []).length;
            features.nb_hyphens = (url.match(/-/g) || []).length;
            features.nb_and = (url.match(/&/g) || []).length;
            features.nb_or = (url.match(/\|/g) || []).length;
            features.nb_www = (url.match(/www/g) || []).length;
            features.nb_com = (url.match(/\.com/g) || []).length;
            features.nb_underscore = (url.match(/_/g) || []).length;
            
            // Combined aspects
            features.nb_aspects = features.nb_dots + features.nb_hyphens + features.nb_and + 
                                 features.nb_or + features.nb_www + features.nb_com + features.nb_underscore;
            
            return features;
        }
        
        // Simple heuristic-based prediction (simulates the trained model)
        function predictPhishing(features) {
            let risk_score = 0;
            
            // Weight-based scoring system (approximates Random Forest decision)
            if (features.url_length > 75) risk_score += 2;
            if (features.url_length > 100) risk_score += 3;
            if (!features.isHttps) risk_score += 4;
            if (features.at_symbol) risk_score += 3;
            if (features.sensitive_words_count > 1) risk_score += features.sensitive_words_count * 2;
            if (features.path_length > 50) risk_score += 2;
            if (features.nb_dots > 4) risk_score += 2;
            if (features.nb_hyphens > 3) risk_score += 2;
            if (features.nb_aspects > 10) risk_score += 3;
            if (!features.valid_url) risk_score += 5;
            
            // Suspicious patterns
            if (features.nb_dots > 3 && features.nb_hyphens > 2) risk_score += 3;
            if (features.sensitive_words_count > 0 && !features.isHttps) risk_score += 4;
            
            const confidence = Math.min(risk_score * 5, 95);
            const is_phishing = risk_score > 5;
            
            return {
                prediction: is_phishing ? 1 : 0,
                confidence: is_phishing ? confidence : (100 - confidence),
                risk_score: risk_score
            };
        }
        
        async function analyzeURL() {
            const urlInput = document.getElementById('url-input');
            const url = urlInput.value.trim();
            
            if (!url) {
                alert('Please enter a URL to analyze');
                return;
            }
            
            // Show loading
            document.getElementById('loading').classList.add('show');
            document.getElementById('result').classList.remove('show');
            
            // Simulate processing time
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            // Extract features and predict
            const features = extractFeatures(url);
            const prediction = predictPhishing(features);
            
            // Hide loading
            document.getElementById('loading').classList.remove('show');
            
            // Display results
            displayResults(prediction, features);
        }
        
        function displayResults(prediction, features) {
            const resultDiv = document.getElementById('result');
            const isSafe = prediction.prediction === 0;
            
            resultDiv.className = 'result show ' + (isSafe ? 'safe' : 'danger');
            
            const statusText = isSafe ? 'LEGITIMATE URL' : 'PHISHING DETECTED';
            const icon = isSafe ? '✓' : '⚠';
            const message = isSafe 
                ? 'This URL appears to be safe based on our analysis.'
                : 'This URL shows suspicious characteristics. Exercise caution!';
            
            resultDiv.innerHTML = `
                <div class="result-status">
                    <div class="result-icon ${isSafe ? 'safe' : 'danger'}">${icon}</div>
                    <div>${statusText}</div>
                </div>
                <p style="color: rgba(255,255,255,0.7); margin-bottom: 1rem;">${message}</p>
                <div class="result-details">
                    <div class="detail-item">
                        <div class="detail-label">Confidence</div>
                        <div class="detail-value">${prediction.confidence.toFixed(1)}%</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">URL Length</div>
                        <div class="detail-value">${features.url_length}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">HTTPS</div>
                        <div class="detail-value">${features.isHttps ? 'Yes' : 'No'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Risk Score</div>
                        <div class="detail-value">${prediction.risk_score}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Sensitive Words</div>
                        <div class="detail-value">${features.sensitive_words_count}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Special Chars</div>
                        <div class="detail-value">${features.nb_aspects}</div>
                    </div>
                </div>
            `;
        }
        
        // Allow Enter key to submit
        document.getElementById('url-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                analyzeURL();
            }
        });
    </script>
</body>
</html>
